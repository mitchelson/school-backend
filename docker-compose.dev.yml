services:
  postgres:
    image: postgres:16-alpine
    container_name: school-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school_db
    ports:
      - '5432:5432'
    volumes:
      - school_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U school -d school_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  school_pgdata_dev:
