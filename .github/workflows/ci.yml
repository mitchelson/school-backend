name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://school:school@localhost:5432/school_db?schema=public
  FIREBASE_PROJECT_ID: test-project
  FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
  FIREBASE_PRIVATE_KEY: test-key
  CRON_SECRET: test-cron-secret

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school -d school_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: ENV
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets da VPS
        id: vps
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER || secrets.VPS_USERNAME }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "auth=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy ignorado — configure VPS_HOST e VPS_USER (ou VPS_USERNAME) no environment ENV."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "auth=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.VPS_PASSWORD }}" ]; then
            echo "auth=password" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "auth=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Configure VPS_SSH_KEY ou VPS_PASSWORD no environment ENV."
          fi

      - name: Deploy via SSH (chave)
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'key'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            bash -lc 'export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"; [ -f "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"; cd /opt/school-backend && git fetch origin main && git reset --hard origin/main && chmod +x deploy/remote-deploy.sh && bash deploy/remote-deploy.sh'

      - name: Deploy via SSH (senha)
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'password'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            bash -lc 'export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"; [ -f "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"; cd /opt/school-backend && git fetch origin main && git reset --hard origin/main && chmod +x deploy/remote-deploy.sh && bash deploy/remote-deploy.sh'
