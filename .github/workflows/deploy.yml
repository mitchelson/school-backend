name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://school:school@localhost:5432/school_db?schema=public
  FIREBASE_PROJECT_ID: test-project
  FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
  FIREBASE_PRIVATE_KEY: test-key
  CRON_SECRET: test-cron-secret

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school -d school_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test-and-build
    environment: ENV

    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets da VPS
        id: vps
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER || secrets.VPS_USERNAME }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "auth=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy ignorado — configure VPS_HOST e VPS_USERNAME no environment ENV."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "auth=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.VPS_PASSWORD }}" ]; then
            echo "auth=password" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "auth=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Configure VPS_SSH_KEY ou VPS_PASSWORD no environment ENV."
          fi

      - uses: actions/setup-node@v4
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none'
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none'
        run: npm ci

      - name: Generate Prisma client & build
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none'
        run: |
          npx prisma generate
          npm run build

      - name: Cache production node_modules
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none'
        id: cache-prod-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: school-prod-modules-${{ hashFiles('package-lock.json') }}

      - name: Install production dependencies
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth != 'none' && steps.cache-prod-modules.outputs.cache-hit != 'true'
        run: npm ci --omit=dev

      - name: Prepare VPS directories
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'key'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: mkdir -p /opt/school-backend /var/log/school-backend

      - name: Prepare VPS directories (senha)
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'password'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: mkdir -p /opt/school-backend /var/log/school-backend

      - name: Transfer artifacts to VPS
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'key'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'dist/,node_modules/,package.json,package-lock.json,ecosystem.config.js,prisma/,deploy/post-deploy.sh,deploy/ensure-platform-settings.sql'
          target: /opt/school-backend
          rm: false

      - name: Transfer artifacts to VPS (senha)
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'password'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: 'dist/,node_modules/,package.json,package-lock.json,ecosystem.config.js,prisma/,deploy/post-deploy.sh,deploy/ensure-platform-settings.sql'
          target: /opt/school-backend
          rm: false

      - name: Migrate & reload PM2
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'key'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            chmod +x /opt/school-backend/deploy/post-deploy.sh
            bash /opt/school-backend/deploy/post-deploy.sh

      - name: Migrate & reload PM2 (senha)
        if: steps.vps.outputs.configured == 'true' && steps.vps.outputs.auth == 'password'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            chmod +x /opt/school-backend/deploy/post-deploy.sh
            bash /opt/school-backend/deploy/post-deploy.sh
