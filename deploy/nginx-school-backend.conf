# /etc/nginx/sites-available/school-backend.conf
# ln -s /etc/nginx/sites-available/school-backend.conf /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx
# certbot --nginx -d api.ct095.com

server {
    listen 80;
    listen [::]:80;
    server_name api.ct095.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-signature $http_x_signature;
        proxy_set_header x-request-id $http_x_request_id;
    }
}
