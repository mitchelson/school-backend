name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push em main dispara deploy.yml (build + SCP), como no zenvix-store.

env:
  DATABASE_URL: postgresql://school:school@localhost:5432/school_db?schema=public
  FIREBASE_PROJECT_ID: test-project
  FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
  FIREBASE_PRIVATE_KEY: test-key
  CRON_SECRET: test-cron-secret-32-characters-min
  PII_ENCRYPTION_KEY: test-pii-encryption-key-32chars!!

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school -d school_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
