name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://school:school@localhost:5432/school_db?schema=public
  FIREBASE_PROJECT_ID: test-project
  FIREBASE_CLIENT_EMAIL: test@test.iam.gserviceaccount.com
  FIREBASE_PRIVATE_KEY: test-key
  CRON_SECRET: test-cron-secret

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school -d school_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test --if-present

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: ENV
    steps:
      - uses: actions/checkout@v4

      - name: Check VPS secrets
        id: vps
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped — configure VPS_HOST and VPS_USER in environment ENV."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        if: steps.vps.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/school-backend
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart school-backend || pm2 start ecosystem.config.js
            echo "✅ school-backend deployed ($(git rev-parse --short HEAD))"
